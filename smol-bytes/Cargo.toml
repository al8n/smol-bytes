[package]
name = "smol-bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = ["std"]
alloc = ["serde_core?/alloc", "bytes"]
std = ["bytes/default", "serde_core?/default"]
serde = ["dep:serde_core"]
borsh = ["dep:borsh"]
arbitrary = ["dep:arbitrary"]
# `async-graphql`'s derives expand to `::std::` paths, so this integration
# cannot be built without `std`.
async-graphql = ["dep:async-graphql", "std"]
# `sqlx` is std-only, so this integration cannot be built without `std`.
sqlx = ["dep:sqlx", "std"]
pyo3 = ["dep:pyo3", "std"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom", "std"]

[dependencies]
bytes = { version = "1.10", default-features = false, optional = true }
paste = "1"

serde_core = { version = "1", optional = true, default-features = false }
borsh = { version = "1", optional = true, default-features = false }

async-graphql = { version = "7", optional = true, default-features = false }
sqlx = { version = "0.9", optional = true, default-features = false }

arbitrary = { version = "1", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }

pyo3 = { version = "0.29", default-features = false, features = ["macros", "abi3-py311"], optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = ["strict-macro"], optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
serde_core = { version = "1", default-features = false }
criterion = { version = "0.8", features = ["html_reports", "cargo_bench_support"] }
serde_test = "1"
smol_str = "0.3"
faststr = "0.2"

[[bench]]
name = "clone"
harness = false

[[bench]]
name = "constructor"
harness = false

[[bench]]
name = "advance"
harness = false

[[bench]]
name = "split_to"
harness = false

[[bench]]
name = "split_off"
harness = false

[[bench]]
name = "copy_to_bytes"
harness = false

[[bench]]
name = "slice"
harness = false

[[bench]]
name = "buffer"
harness = false

[[bench]]
name = "bytes_mut"
harness = false

[[bench]]
name = "utf8"
harness = false
