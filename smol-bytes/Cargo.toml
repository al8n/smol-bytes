[package]
name = "smol-bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = ["std"]
alloc = ["serde_core?/alloc", "bytes"]
std = ["bytes/default", "serde_core?/default"]
serde = ["dep:serde_core"]
borsh = ["dep:borsh"]
arbitrary = ["dep:arbitrary"]
# `async-graphql`'s derives expand to `::std::` paths, so this integration
# cannot be built without `std`.
async-graphql = ["dep:async-graphql", "std"]
# `sqlx` is std-only, so this integration cannot be built without `std`.
sqlx = ["dep:sqlx", "std"]
pyo3 = ["dep:pyo3", "std"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom", "std"]

[dependencies]
bytes = { version = "1.10", default-features = false, optional = true }
paste = "1"

serde_core = { version = "1", optional = true, default-features = false }
borsh = { version = "1", optional = true, default-features = false }

# Only the scalar machinery is used; the default features pull in a GraphiQL
# playground, an email validator and `tempfile`, none of which a scalar needs.
# Note that `async-graphql` 7.2 declares `rust-version = "1.89"`, above this
# crate's own MSRV — enabling this feature raises it for the whole build.
async-graphql = { version = "7.2", optional = true, default-features = false }
# Only the `Type`/`Encode`/`Decode` traits are used; the default features pull
# in the `Any` driver, the macros, the migrator and JSON support, none of which
# a type binding needs. The `0.9` floor is deliberate: the impls are written
# against `Database::ArgumentBuffer` without a lifetime parameter, which is a
# 0.9 change. Note that sqlx 0.9 declares `rust-version = "1.94"`, far above
# this crate's own MSRV — enabling this feature raises it for the whole build.
sqlx = { version = "0.9", optional = true, default-features = false }

arbitrary = { version = "1", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }

pyo3 = { version = "=0.29.2", default-features = false, features = ["macros", "abi3-py311"], optional = true }
wasm-bindgen = { version = "=0.2.126", default-features = false, features = ["strict-macro"], optional = true }
js-sys = { version = "=0.3.103", optional = true }
# `quickcheck` reaches getrandom 0.4 through rand 0.10; its WebAssembly backend
# is opt-in via the wasm_js feature, so enable it whenever the wasm binding
# feature is selected.
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
serde_core = { version = "1", default-features = false }
criterion = { version = "0.8", features = ["html_reports", "cargo_bench_support"] }
serde_test = "1"
smol_str = "0.3"
faststr = "0.2"

[[bench]]
name = "clone"
harness = false

[[bench]]
name = "constructor"
harness = false

[[bench]]
name = "advance"
harness = false

[[bench]]
name = "split_to"
harness = false

[[bench]]
name = "split_off"
harness = false

[[bench]]
name = "copy_to_bytes"
harness = false

[[bench]]
name = "slice"
harness = false

[[bench]]
name = "buffer"
harness = false

[[bench]]
name = "bytes_mut"
harness = false

[[bench]]
name = "utf8"
harness = false
